name: Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        db: ['sqlite', 'mysql', 'postgres']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: steward_testing
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: steward_testing
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute Tests (SQLite)
        if: matrix.db == 'sqlite'
        run: vendor/bin/pest

      - name: Execute Tests (MySQL)
        if: matrix.db == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: steward_testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: vendor/bin/pest

      - name: Execute Tests (PostgreSQL)
        if: matrix.db == 'postgres'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: steward_testing
          DB_USERNAME: postgres
          DB_PASSWORD: secret
        run: vendor/bin/pest
